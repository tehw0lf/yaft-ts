name: build and publish pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: external workflow
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      actions: write
      attestations: write
      contents: write
      packages: write
      id-token: write
      security-events: write
      pull-requests: write
    with:
      tool: "npm"
      test: "run test"
      build_branch: "run build"
      build_main: "run build"
      artifact_path: "dist"
      # dist/yaft, not dist: the build writes the package there, and with
      # library_path=dist the reusable workflow publishes from the repository
      # root instead -- which is how 0.0.9 through 0.0.15 shipped raw src/
      # with no entry points and could not be imported at all.
      library_path: "dist/yaft"
      npm_audit_omit_dev: true
